controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Trajectory controllers for the arms (used by the gazebo example).
    left_arm_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Forward velocity controllers for the arms (used by the demo example).
    left_arm_joint_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    right_arm_joint_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    lift_0_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    platform_velocity_controller:
      type: mecanum_drive_controller/MecanumDriveController

# Trajectory controllers for the arms. Used by the gazebo example and
# compatible with the rqt_joint_trajectory_controller GUI.
left_arm_joint_trajectory_controller:
  ros__parameters:
    use_sim_time: True
    joints:
      - left_fr3_joint1
      - left_fr3_joint2
      - left_fr3_joint3
      - left_fr3_joint4
      - left_fr3_joint5
      - left_fr3_joint6
      - left_fr3_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    gains:
      left_fr3_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
      left_fr3_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
      left_fr3_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
      left_fr3_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
      left_fr3_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
      left_fr3_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
      left_fr3_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }

right_arm_joint_trajectory_controller:
  ros__parameters:
    use_sim_time: True
    joints:
      - right_fr3_joint1
      - right_fr3_joint2
      - right_fr3_joint3
      - right_fr3_joint4
      - right_fr3_joint5
      - right_fr3_joint6
      - right_fr3_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    gains:
      right_fr3_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
      right_fr3_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
      right_fr3_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
      right_fr3_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
      right_fr3_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
      right_fr3_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
      right_fr3_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }

# Forward velocity controllers for the arms. Used by the demo example: they
# forward a velocity command (std_msgs/Float64MultiArray on
# <controller>/commands) straight to the joints, which is convenient for
# streaming or replaying recorded teleoperation rosbags.
left_arm_joint_velocity_controller:
  ros__parameters:
    use_sim_time: True
    joints:
      - left_fr3_joint1
      - left_fr3_joint2
      - left_fr3_joint3
      - left_fr3_joint4
      - left_fr3_joint5
      - left_fr3_joint6
      - left_fr3_joint7

right_arm_joint_velocity_controller:
  ros__parameters:
    use_sim_time: True
    joints:
      - right_fr3_joint1
      - right_fr3_joint2
      - right_fr3_joint3
      - right_fr3_joint4
      - right_fr3_joint5
      - right_fr3_joint6
      - right_fr3_joint7

head_controller:
  ros__parameters:
    use_sim_time: True
    joints:
      - o1_motor_1
      - o1_motor_2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

lift_0_position_controller:
  ros__parameters:
    use_sim_time: True
    joints:
      - lift_0_lower_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

platform_velocity_controller:
  ros__parameters:
    use_sim_time: True
    interface_name: velocity

    command_joint_names: ["front_left_wheel_joint", "rear_left_wheel_joint", "rear_right_wheel_joint", "front_right_wheel_joint"]

    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"

    kinematics.base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
    kinematics.wheels_radius: 0.0759
    kinematics.sum_of_robot_center_projection_on_X_Y_axis: 0.59
    wheel_separation_multiplier: 1.0
    wheel_radius_multiplier: 1.0

    publish_rate: 20.0
    reference_timeout: 2.0
    use_stamped_vel: False

    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]

    cmd_vel_timeout: 0.5

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: false
    tf_frame_prefix_enable: false

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.3
    linear.x.min_velocity: -1.3
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    linear.y.has_velocity_limits: true
    linear.y.has_acceleration_limits: true
    linear.y.has_jerk_limits: false
    linear.y.max_velocity: 1.3
    linear.y.min_velocity: -1.3
    linear.y.max_acceleration: 1.0
    linear.y.min_acceleration: -1.0
    linear.y.max_jerk: 0.0
    linear.y.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 4.0
    angular.z.min_velocity: -4.0
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0