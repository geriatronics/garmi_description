# =================================================================================================
# Configuration of code sanity tools
#
# These rules are garmi-core's, verbatim: garmi_description is consumed as a submodule of
# garmi-core, which judges its whole tree on push, so a rule that differs here is a rule that
# fails there. Kept as a standalone ruff.toml rather than a [tool.ruff] table in a pyproject.toml
# because this repository's ROS package lives in garmi_description/ and ships via ament_cmake --
# a pyproject at the root would claim a packaging role the repository does not have.
#
# File-local exceptions go in the source as `# noqa`, never in this file's per-file-ignores:
# garmi-core lints this tree with ITS config, which cannot see ours, so only a directive that
# travels with the file is honoured by both gates.
# =================================================================================================

line-length = 100
target-version = "py312"
respect-gitignore = true
# Write-capable gate tools touch code files only: this ruff version's formatter also rewrites
# fenced Python blocks inside Markdown, so an allowlist keeps every invocation off prose and
# configs by construction rather than by luck.
include = ["*.py", "*.pyi"]

# -------------------------------------------------------------------------------------------------
[lint]
# Enable rules
select = [
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "RUF",  # Ruff-specific rules
    "Q",    # flake8-quotes
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PL",   # pylint
]

# Ignore specific rules
ignore = [
    "E501",     # Line too long (handled by formatter)
    "PLR2004",  # Magic value used in comparison
    "ISC001",   # Auto-concatenating strings may not be intentional
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[lint.isort]
# Import sorting configuration.
# Listing project-internal modules explicitly so first-party classification
# is the same regardless of where ruff is invoked from. Without this, the
# detect-same-package heuristic flip-flops between CWDs (e.g. this repository's
# root vs garmi-core's, which vendors it as a submodule), producing mutually
# inconsistent I001 verdicts between the two gates.
known-first-party = [
    "garmi_description",
]
detect-same-package = false
combine-as-imports = true

[lint.per-file-ignores]
# Ignore specific rules for certain files
"__init__.py" = ["F401"]    # Unused imports in __init__ files
"tests/*" = ["S101"]        # Allow assert in tests

[lint.pydocstyle]
convention = "pep257"


# -------------------------------------------------------------------------------------------------
[format]
# Formatting options
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
