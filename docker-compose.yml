x-ros-base: &ros-base
  build: .
  image: garmi-sim-model
  volumes:
    - ./garmi_description:/ws/src/garmi_description
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
    - ./rqt_gui.ini:/root/.config/ros.org/rqt_gui.ini:rw
  environment:
    - DISPLAY=${DISPLAY}
    - QT_X11_NO_MITSHM=1
    - XAUTHORITY=/root/.Xauthority
    - GZ_SIM_RESOURCE_PATH=/ws/src/
  # Support hardware acceleration
  devices:
    - /dev/dri:/dev/dri
  network_mode: host

# Standalone MuJoCo (no ROS).
x-mujoco-base: &mujoco-base
  build:
    context: .
    dockerfile: Dockerfile.mujoco
  image: garmi-mujoco
  volumes:
    # Mount the whole package so the MuJoCo teleop can reuse scripts/.
    - ./garmi_description:/pkg
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
  working_dir: /pkg/mujoco
  environment:
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/root/.Xauthority
    - MUJOCO_GL=glfw
  devices:
    - /dev/dri:/dev/dri
  network_mode: host

services:
  rviz:
    <<: *ros-base
    command: ros2 launch garmi_description display.launch.py

  gazebo:
    <<: *ros-base
    command: ros2 launch garmi_description gazebo.launch.py

  gazebo-motion:
    <<: *ros-base
    command: ros2 launch garmi_description gazebo_demo.launch.py

  # Interactive viewer (drag joints / apply forces), robot in its home pose.
  mujoco:
    <<: *mujoco-base
    command: python view.py

  # Viewer + a twist teleop panel (joystick + turn slider) for the mecanum base.
  mujoco-teleop:
    <<: *mujoco-base
    command: python teleop.py
